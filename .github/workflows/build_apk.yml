name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Build & Verify Keystore
        run: |
          flutter config --no-analytics

          # 1. Update version di pubspec.yaml
          BASE_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          NEW_VERSION="${BASE_VERSION}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/g" pubspec.yaml

          # 2. Backup Keystore fisik jika sudah ter-commit di repo
          if [ -f "android/app/upload-keystore.jks" ]; then
            cp android/app/upload-keystore.jks /tmp/upload-keystore.jks
          fi

          # 3. Re-generate folder android
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml

          # Restore Keystore fisik
          if [ -f "/tmp/upload-keystore.jks" ]; then
            cp /tmp/upload-keystore.jks android/app/upload-keystore.jks
          fi

          # Jika Keystore fisik belum ada sama sekali, buat versi konsisten
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -dname "CN=OetanKayoe, OU=Dev, O=OetanKayoe, L=Jakarta, ST=Jakarta, C=ID" \
              -storepass "OetanKayoe123!" \
              -keypass "OetanKayoe123!"
          fi

          # Ganti nama tampilan aplikasi
          sed -i 's/android:label="[^"]*"/android:label="Oetan Kayoe Flutter App"/g' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Oetan Kayoe Flutter App<\/string>/g' android/app/src/main/res/values/strings.xml
          fi

          # 4. Injeksi variabel signing ke android/gradle.properties
          KEYSTORE_PATH="$(pwd)/android/app/upload-keystore.jks"
          cat <<EOF >> android/gradle.properties
          android.injected.signing.store.file=$KEYSTORE_PATH
          android.injected.signing.store.password=OetanKayoe123!
          android.injected.signing.key.alias=upload
          android.injected.signing.key.password=OetanKayoe123!
          EOF

          flutter pub get
          dart run flutter_launcher_icons

      - name: Print Keystore Diagnostic & Fingerprint
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          
          echo "=========================================="
          echo "DETAILED KEYSTORE DIAGNOSTIC"
          echo "=========================================="
          
          # Tampilkan Fingerprint SHA-256 Kunci
          FINGERPRINT=$(keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "OetanKayoe123!" | grep "SHA256:" || echo "Keystore Not Found")
          
          echo "Full Version : $VERSION_FULL"
          echo "Keystore Path: android/app/upload-keystore.jks"
          echo "$FINGERPRINT"
          echo "=========================================="

          # Tampilkan langsung di halaman Job Summary GitHub Actions
          echo "### 🔑 Keystore Verification" >> $GITHUB_STEP_SUMMARY
          echo "* **Full Version:** \`$VERSION_FULL\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Signing Fingerprint:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$FINGERPRINT" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Build APK Release (Signed)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
 
