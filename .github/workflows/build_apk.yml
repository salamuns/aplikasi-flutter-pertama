name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files & Setup Keystore
        run: |
          flutter config --no-analytics
          cp pubspec.yaml pubspec.yaml.bak
          
          # 1. Generate project Android
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml

          # Ganti nama tampilan aplikasi
          sed -i 's/android:label="[^"]*"/android:label="Oetan Kayoe Flutter App"/g' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Oetan Kayoe Flutter App<\/string>/g' android/app/src/main/res/values/strings.xml
          fi

          # 2. Buat Keystore dengan nilai permanen
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -dname "CN=OetanKayoe, OU=Dev, O=OetanKayoe, L=Jakarta, ST=Jakarta, C=ID" \
            -storepass "OetanKayoe123!" \
            -keypass "OetanKayoe123!"

          # 3. Inject konfigurasi signing ke key.properties
          cat <<EOF > android/key.properties
          storePassword=OetanKayoe123!
          keyPassword=OetanKayoe123!
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          flutter pub get
          dart run flutter_launcher_icons

      - name: Print Build Info & Summary
        run: |
          # Mengambil versi dari pubspec.yaml (misal: 1.0.0)
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          
          echo "=========================================="
          echo "BUILD INFO"
          echo "Build Name   : $VERSION_NAME"
          echo "Build Number : ${{ github.run_number }}"
          echo "Full Version : $VERSION_NAME+${{ github.run_number }}"
          echo "=========================================="
          
          # Menampilkan informasi di halaman ringkasan (Job Summary) GitHub Actions
          echo "### 🚀 APK Version Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Version Name:** \`$VERSION_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Build Number:** \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Full Version:** \`$VERSION_NAME+${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build APK Release (Signed)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
 
