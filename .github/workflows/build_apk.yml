name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Mengaktifkan caching agar download SDK & dependencies jauh lebih cepat
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter Telemetry & Prepare Android
        run: |
          flutter config --no-analytics
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get

      # Build APK khusus 64-bit (Proses kompilasi jauh lebih cepat)
      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
