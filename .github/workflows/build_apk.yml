name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files, Icon & Secure Pubspec
        run: |
          flutter config --no-analytics
          git checkout pubspec.yaml 2>/dev/null || true
          cp pubspec.yaml pubspec.yaml.bak
          
          # Gunakan --project-name menggantikan --name
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe --project-name oetan_kayoe_app
          
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Android Files, Icon & Secure Pubspec
        run: |
          flutter config --no-analytics
          git checkout pubspec.yaml 2>/dev/null || true
          cp pubspec.yaml pubspec.yaml.bak
          
          # Atur nama tampilan aplikasi langsung pakai parameter --name "Nama Bebas"
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe --name "Oetan Kayoe App"
          
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Android Files, Icon, Name & Secure Pubspec
        run: |
          flutter config --no-analytics
          git checkout pubspec.yaml 2>/dev/null || true
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get
          # Memproses ikon dan nama aplikasi
          dart run flutter_launcher_icons
          dart run flutter_app_name # <-- Tambahan baru

      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
