name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files & Setup Signing Key
        run: |
          flutter config --no-analytics
          
          # 1. Simpan dulu build.gradle.kts buatan kita agar tidak ditimpa flutter create
          if [ -f "android/app/build.gradle.kts" ]; then
            cp android/app/build.gradle.kts build.gradle.kts.bak
          fi

          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml

          # kembalikan build.gradle.kts resmi kita
          if [ -f "build.gradle.kts.bak" ]; then
            cp build.gradle.kts.bak android/app/build.gradle.kts
          fi

          # 2. Buat Keystore Permanen
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias oetankayoe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "OetanKayoePass2026" -keypass "OetanKayoePass2026" \
            -dname "CN=OetanKayoe, OU=Dev, O=App, L=City, C=ID"

          # 3. Buat key.properties resmi
          cat <<EOF > android/key.properties
          storePassword=OetanKayoePass2026
          keyPassword=OetanKayoePass2026
          keyAlias=oetankayoe
          storeFile=release.keystore
          EOF

          # 4. Generate Ikon
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
 
