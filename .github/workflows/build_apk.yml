name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Files & Auto-Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter config --no-analytics
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --android-language kotlin --org com.oetankayoe
          cp pubspec.yaml.bak pubspec.yaml

          # Ganti label nama aplikasi
          sed -i 's/android:label="[^"]*"/android:label="Oetan Kayoe App"/g' android/app/src/main/AndroidManifest.xml

          # Buat Keystore otomatis menggunakan password dari GitHub Secret
          PASS=${KEYSTORE_PASSWORD:-"OetanKayoePass2026"}
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias oetankayoe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=OetanKayoe, OU=Dev, O=App, L=City, C=ID"

          # Konfigurasi Gradle agar menggunakan keystore permanen ini
          cat <<EOF > android/key.properties
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=oetankayoe
          storeFile=release.keystore
          EOF

          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK Release (64-bit)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Release-64bit
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
