name: Delete Old Workflow Runs

on:
  workflow_dispatch: # Jalankan manual dari tombol Actions

permissions:
  actions: write # Memberikan izin ke token untuk menghapus history

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
