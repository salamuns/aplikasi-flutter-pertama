name: Delete Old Workflow Runs

on:
  push:
    branches: [ main, master ] # Otomatis jalan tiap kali ada push ke main/master
  workflow_dispatch:           # Tetap menyediakan tombol manual di tab Actions

permissions:
  actions: write # Izin mutlak untuk menghapus log history

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
