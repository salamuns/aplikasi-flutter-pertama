name: Generate & Commit Permanent Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate & Force Push Keystore to Repo
        run: |
          mkdir -p android/app
          
          # 1. Buat Keystore
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -dname "CN=OetanKayoe, OU=Dev, O=OetanKayoe, L=Jakarta, ST=Jakarta, C=ID" \
            -storepass "OetanKayoe123!" \
            -keypass "OetanKayoe123!"

          # 2. Hapus .gitignore jika ada aturan yang memblokir file .jks
          sed -i '/upload-keystore.jks/d' .gitignore || true
          sed -i '/*.jks/d' .gitignore || true

          # 3. Paksa commit file fisik ke Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android/app/upload-keystore.jks
          git commit -m "add fixed permanent keystore file" || true
          git push
 
