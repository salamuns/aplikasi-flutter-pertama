name: aplikasi_flutter
description: Aplikasi Flutter Pertama

version: 1.0.4+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_app_name: ^0.1.1  # <-- Tambahan baru

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# <-- Tambahan baru untuk menentukan nama tampilan aplikasi di HP
flutter_app_name:
  name: "Nama Aplikasi Kamu"  # Ganti dengan nama aplikasi yang kamu inginkan
