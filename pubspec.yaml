name: aplikasi_flutter
description: Aplikasi Flutter Pertama

version: 1.0.9+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_app_name: ^0.1.1 # 1. Tambahkan package ini

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# 2. Atur nama tampilan aplikasi di layar HP di sini (Bebas Spasi & Huruf Kapital)
flutter_app_name:
  name: "App Flutter Q"
